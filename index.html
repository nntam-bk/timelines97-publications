<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Peer-reviewed publications by Nhat-Tam Nguyen in mechanics, structural health monitoring, data-driven modeling, and computational engineering.">
<title>Nhat-Tam Nguyen | International Publications</title>
<style>
  :root {
    color-scheme: light;
    --hero-background: #030d20;
    --hero-panel: rgba(5, 21, 46, 0.78);
    --hero-border: rgba(70, 133, 204, 0.34);
    --hero-accent: #d8a72f;
    --hero-line: #1c477c;
    --page-background: #ffffff;
  }

  html { background: var(--page-background); scroll-behavior: smooth; }
  body {
    margin: 0;
    min-width: 280px;
    background: var(--page-background);
    color: #333333;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }

  .publication-hero,
  .publication-hero * { box-sizing: border-box; }

  .publication-hero {
    position: relative;
    display: grid;
    min-height: clamp(320px, 42vw, 540px);
    place-items: center;
    overflow: hidden;
    isolation: isolate;
    background: radial-gradient(circle at 50% 45%, rgba(28, 71, 124, 0.16), transparent 42%), var(--hero-background);
  }

  .publication-particle-canvas {
    position: absolute;
    inset: 0;
    z-index: -1;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .publication-hero-content {
    width: min(calc(100% - 32px), 760px);
    padding: clamp(28px, 5vw, 48px);
    border: 1px solid var(--hero-border);
    border-radius: 18px;
    background: var(--hero-panel);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    color: #ffffff;
    text-align: left;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .publication-hero-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 16px;
    color: #dcecff;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .publication-hero-kicker::before {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--hero-accent);
    box-shadow: 0 0 14px rgba(216, 167, 47, 0.7);
    content: "";
  }

  .publication-hero h1 {
    margin: 0;
    color: #ffffff;
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 750;
    letter-spacing: -0.045em;
    line-height: 1.02;
  }

  .publication-hero h1 span { color: var(--hero-accent); }

  .publication-hero-description {
    max-width: 64ch;
    margin: 18px 0 0;
    color: #d6e0ed;
    font-size: clamp(0.95rem, 1.5vw, 1.08rem);
    line-height: 1.65;
  }

  .publication-hero-rule {
    width: min(190px, 42%);
    height: 3px;
    margin-top: 24px;
    border: 0;
    background: linear-gradient(90deg, var(--hero-accent), #3779bd 72%, transparent);
  }

  .publication-page-content {
    width: min(calc(100% - 32px), 1280px);
    margin: 0 auto;
    padding: 20px 0 48px;
  }

  @media (max-width: 600px) {
    .publication-hero { min-height: 360px; }
    .publication-hero-content { padding: 28px 24px; border-radius: 14px; }
    .publication-page-content { width: min(calc(100% - 20px), 1280px); padding-top: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<header class="publication-hero" id="publicationHero">
  <canvas class="publication-particle-canvas" id="publicationParticleCanvas" aria-hidden="true"></canvas>
  <div class="publication-hero-content">
    <p class="publication-hero-kicker">International Journal Papers</p>
    <h1>International <span>Publications</span></h1>
    <p class="publication-hero-description">Selected peer-reviewed research articles on mechanics, structural health monitoring, data-driven modeling, and computational engineering.</p>
    <div class="publication-hero-rule" aria-hidden="true"></div>
  </div>
</header>

<main class="publication-page-content">
<div id="publicationApp"></div>

  function bindPlumXMobilePopupClamp() {
    if (plumXMobilePopupClampBound) return;

      updatePlumXPopupMode();

    document.addEventListener("touchstart", function (event) {

      if (!link) return;

    document.addEventListener("click", function (event) {
      const link = event.target && event.target.closest ? event.target.closest(".auto-plumx-widget .plumx-plum-print-popup") : null;
      if (!link) return;

    document.addEventListener("mouseleave", function (event) {
      const card = event.target.closest ? event.target.closest(".filterItem.plumx-card-active") : null;
      if (!card) return;

      clearTimeout(plumXCardDeactivateTimer);
      plumXCardDeactivateTimer = window.setTimeout(function () {
        resetPlumXInlineStacking();

    }, true);

    window.addEventListener("resize", function () {
      updatePlumXPopupMode();
      if (isMobileViewport()) clampPlumXPopupToIframe();
    }, { passive: true });

    window.addEventListener("scroll", function () {
      if (isMobileViewport()) clampPlumXPopupToIframe();

    if ("MutationObserver" in window && !plumXMutationObserver) {
      plumXMutationObserver = new MutationObserver(function () {
        if (!isMobileViewport()) return;
        clampPlumXPopupToIframe();

        plumXMutationObserver.observe(document.body, {
          childList: true,

          attributes: true,

  function elementLooksLikeVisiblePlumXPopup(el) {
    if (!el || el.nodeType !== 1) return false;
    if (el.closest(".auto-plumx-widget")) return false;

    const className = typeof el.className === "string" ? el.className.toLowerCase() : "";
    const id = typeof el.id === "string" ? el.id.toLowerCase() : "";
    const aria = String(el.getAttribute("aria-label") || "").toLowerCase();
    const role = String(el.getAttribute("role") || "").toLowerCase();
    const text = String(el.textContent || "").toLowerCase();

    const rect = el.getBoundingClientRect();
    if (!rect || rect.width < 80 || rect.height < 40) return false;

    const style = window.getComputedStyle(el);
    if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) === 0) return false;

    const hasPlumXByName =
      className.includes("plumx") ||
      id.includes("plumx") ||
      aria.includes("plumx") ||
      text.includes("plumx");

    const hasPlumXByContent =
      text.includes("citation indexes") ||
      text.includes("citations") ||
      text.includes("captures") ||
      text.includes("readers") ||
      text.includes("usage") ||
      text.includes("mentions");

    const hasPopupLikeShape =
      style.position === "absolute" ||
      style.position === "fixed" ||
      className.includes("popup") ||
      id.includes("popup") ||
      className.includes("tooltip") ||
      id.includes("tooltip") ||
      role === "tooltip";

    return (hasPlumXByName || hasPlumXByContent) && hasPopupLikeShape;
  }

  function getOuterVisiblePlumXPopups() {
    let candidates = Array.from(document.querySelectorAll("body *"))
      .filter(elementLooksLikeVisiblePlumXPopup);

    candidates = candidates.filter(function (el) {
      return !candidates.some(function (other) {
        return other !== el && other.contains(el);
      });
    });

    return candidates;
  }

  function raiseVisiblePlumXPopups() {
    const candidates = getOuterVisiblePlumXPopups();

    candidates.forEach(function (popup) {
      popup.style.setProperty("position", "fixed", "important");
      popup.style.setProperty("z-index", "2147483647", "important");
      popup.style.setProperty("pointer-events", "auto", "important");
      popup.style.setProperty("isolation", "isolate", "important");
      popup.style.setProperty("overflow", "visible", "important");

      popup.querySelectorAll("*").forEach(function (child) {
        child.style.setProperty("z-index", "2147483647", "important");
      });
    });
  }

  function clampPlumXPopupToIframe() {
    if (!isMobileViewport()) return;

    const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 360;
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 640;
    const sideGap = 6;

    const candidates = getOuterVisiblePlumXPopups();

    const activeCard = activePlumXTrigger
      ? activePlumXTrigger.closest(".filterItem")
      : null;

    const triggerRect = activePlumXTrigger
      ? activePlumXTrigger.getBoundingClientRect()
      : null;

    const cardRect = activeCard
      ? activeCard.getBoundingClientRect()
      : null;

    candidates.forEach(function (popup) {
      popup.style.setProperty("box-sizing", "border-box", "important");
      popup.style.setProperty("z-index", "2147483647", "important");
      popup.style.setProperty("position", "fixed", "important");
      popup.style.setProperty("pointer-events", "auto", "important");
      popup.style.setProperty("isolation", "isolate", "important");
      popup.style.setProperty("overflow", "visible", "important");

      popup.style.removeProperty("width");
      popup.style.removeProperty("max-width");
      popup.style.removeProperty("min-width");

      popup.style.setProperty("right", "auto", "important");
      popup.style.setProperty("bottom", "auto", "important");

      const popupRect = popup.getBoundingClientRect();
      if (!popupRect.width || popupRect.width < 80) return;

      let newLeft = popupRect.left;
      let newTop = popupRect.top;

      if (triggerRect && cardRect && getMobilePlumXPlacement() === "upper") {
        newLeft = triggerRect.left + triggerRect.width / 2 - popupRect.width / 2;
        newTop = cardRect.top - 12;
      }

      if (triggerRect && getMobilePlumXPlacement() === "down") {
        newLeft = triggerRect.left + triggerRect.width / 2 - popupRect.width / 2;
        newTop = triggerRect.bottom + 10;
      }

      if (newLeft + popupRect.width > viewportWidth - sideGap) {
        newLeft = viewportWidth - popupRect.width - sideGap;
      }

      if (newLeft < sideGap) {
        newLeft = sideGap;
      }

      if (newTop + popupRect.height > viewportHeight - sideGap) {
        newTop = viewportHeight - popupRect.height - sideGap;
      }

      if (newTop < sideGap) {
        newTop = sideGap;
      }

      popup.style.setProperty("left", Math.round(newLeft) + "px", "important");
      popup.style.setProperty("top", Math.round(newTop) + "px", "important");

      popup.querySelectorAll("*").forEach(function (child) {
        child.style.setProperty("z-index", "2147483647", "important");
        child.style.setProperty("box-sizing", "border-box", "important");
      });
    });
  }

  function normalizeJournalName(name) {
    return String(name || "")
      .replace(/\s+/g, " ")
      .replace(/\s*-\s*/g, " - ")
      .replace(/[.,;:]+$/g, "")
      .trim()
      .toLowerCase();
  }

  async function fetchSheetRows(sheetName) {
    const csvUrl =
      "https://docs.google.com/spreadsheets/d/" +
      encodeURIComponent(CONFIG.spreadsheetId) +
      "/gviz/tq?tqx=out:csv&headers=1&sheet=" +
      encodeURIComponent(sheetName);

    const csvResponse = await fetch(csvUrl, { method: "GET" });
    if (csvResponse.ok) {
      return parseCsvRows(await csvResponse.text());
    }

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      encodeURIComponent(CONFIG.spreadsheetId) +
      "/gviz/tq?tqx=out:json&headers=1&sheet=" +
      encodeURIComponent(sheetName);

    const response = await fetch(url, { method: "GET" });
    if (!response.ok) {
      throw new Error("Cannot read sheet: " + sheetName + " (HTTP " + response.status + ")");
    }

    const text = await response.text();
    const jsonStart = text.indexOf("{");
    const jsonEnd = text.lastIndexOf("}");
    if (jsonStart < 0 || jsonEnd < 0) {
      throw new Error("Invalid Google Sheets response for: " + sheetName);
    }

    const data = JSON.parse(text.slice(jsonStart, jsonEnd + 1));
    const cols = (data.table.cols || []).map(col => normalizeHeader(col.label || col.id || ""));
    const rows = (data.table.rows || []).map(row => {
      const obj = {};
      (row.c || []).forEach((cell, index) => {
        const key = cols[index] || ("col" + index);
        const value = cell ? (cell.f != null ? cell.f : cell.v) : "";
        obj[key] = value == null ? "" : value;
      });
      return obj;
    });

    return rows.filter(row => Object.values(row).some(v => String(v || "").trim() !== ""));
  }

  function parseAuthorsConcernRows(rows) {
    const seen = new Set();
    const authors = [];

    rows.forEach(row => {
      const enabled = pick(row, ["enabled", "isEnabled", "show", "active"]);
      if (!isEnabledValue(enabled)) return;

      const name = pick(row, ["authorName", "author", "name", "authorsConcern"]);
      if (!name) return;

      const key = normalizeName(name);
      if (!key || seen.has(key)) return;

      seen.add(key);
      authors.push(name);
    });

    return authors;
  }

  function parsePaperRow(row) {
    const doi = normalizeDoi(pick(row, ["doi", "DOI"]));
    const doiUrlRaw = pick(row, ["doiUrl", "doiLink", "DOIUrl"]);
    const authors = splitList(pick(row, ["authors", "authorNames", "authorList"]));

    const paper = {
      sourceRowIndex: row.sourceRowIndex,
      year: pick(row, ["year", "publicationYear"]),
      enabled: isPaperEnabled(row),
      title: pick(row, ["title", "paperTitle"]),
      doi: doi || extractDoiFromText(doiUrlRaw),
      authors: authors,
      journal: pick(row, ["journal", "journalName"]),
      volume: pick(row, ["volume"]),
      issue: pick(row, ["issue"]),
      pages: pick(row, ["pages", "page"]),
      articleNo: pick(row, ["articleNo", "articleNumber", "article"]),
      thumbnail: pick(row, ["thumbnail", "thumbnailLink", "image", "imageLink"]),
      showThumbnail: isYesValue(pick(row, ["showThumbnail", "show thumbnail", "graphicalAbstract", "showGraphicalAbstract"])),
      firstAuthor: splitList(pick(row, ["firstAuthor", "firstAuthors"])),
      coFirstAuthor: splitList(pick(row, ["coFirstAuthor", "coFirstAuthors", "coFirst"])),
      correspondingAuthor: splitList(pick(row, ["correspondingAuthor", "correspondingAuthors"])),
      risLink: pick(row, ["risLink", "RIS"]),
      bibtexLink: pick(row, ["bibtexLink", "bibtex"]),
      textLink: pick(row, ["textLink", "plainTextLink", "text"]),
      abstract: pick(row, ["abstract", "Abstract", "paperAbstract"]),
      note: pick(row, ["note", "notes"])
    };

    paper.doiUrl = getDoiUrl(paper.doi, doiUrlRaw);
    paper.concernedAuthorsInPaper = getConcernedAuthorsInPaper(paper);
    paper.roles = getPaperRoles(paper);
    paper.authorSlugs = paper.concernedAuthorsInPaper.map(name => slugify(name));
    paper.primaryRole = getPrimaryRole(paper.roles);

    return paper;
  }

  function isPaperEnabled(row) {
    const enabled = pick(row, ["enabled", "isEnabled", "show", "active"]);
    return isEnabledValue(enabled);
  }

  function parseJournalMetricRow(row) {
    return {
      journal: pick(row, ["journal", "journalName"]),
      impactFactor: pick(row, [
        "impactFactor",
        "ImpactFactor",
        "IF",
        "impact factor",
        "Impact Factor",
        "journalImpactFactor",
        "journal IF"
      ]),
      jcr: pick(row, [
        "jcr",
        "JCR",
        "quartile",
        "JCR Quartile",
        "jcrQuartile",
        "jcrPercentile",
        "JCR Percentile"
      ]),
      metricYear: pick(row, ["metricYear", "year", "metric year"]),
      coverImage: pick(row, [
        "coverImage",
        "cover image",
        "journalCover",
        "journalCoverImage",
        "journal cover",
        "journal cover image",
        "cover",
        "image",
        "imageUrl",
        "image URL",
        "coverUrl",
        "cover URL"
      ])
    };
  }

  function getConcernedAuthorsInPaper(paper) {
    if (!AUTHORS_CONCERN.length) return [];

    return AUTHORS_CONCERN.filter(concerned =>
      paper.authors.some(author => nameMatches(author, concerned))
    );
  }

  function authorHasRole(author, roleList) {
    return roleList.some(roleName => nameMatches(author, roleName));
  }

  function getRoleForAuthor(author, paper) {
    const roles = [];

    if (authorHasRole(author, paper.correspondingAuthor)) roles.push("corresponding");
    if (authorHasRole(author, paper.firstAuthor)) roles.push("first");
    if (authorHasRole(author, paper.coFirstAuthor)) roles.push("co-first");

    if (!roles.length) roles.push("co-author");

    return roles;
  }

  function getPaperRoles(paper) {
    const roleSet = new Set();
    const concernedAuthors = paper.concernedAuthorsInPaper || [];

    concernedAuthors.forEach(author => {
      getRoleForAuthor(author, paper).forEach(role => roleSet.add(role));
    });

    if (!roleSet.size) {
      roleSet.add("co-author");
    }

    return Array.from(roleSet);
  }

  function getPrimaryRole(roles) {
    if (roles.includes("corresponding")) return "corresponding";
    if (roles.includes("first")) return "first";
    if (roles.includes("co-first")) return "co-first";
    return "co-author";
  }

  function getAuthorRolesMap(paper) {
    const map = {};

    (paper.concernedAuthorsInPaper || []).forEach(author => {
      const slug = slugify(author);
      if (!slug) return;
      map[slug] = getRoleForAuthor(author, paper);
    });

    return map;
  }

  function parseAuthorRolesMap(item) {
    try {
      return JSON.parse(item.dataset.authorRoles || "{}");
    } catch (error) {
      return {};
    }
  }

  function getRoleTagText(roles) {
    if (!roles || !roles.length) return ROLE_CONFIG["co-author"].text;

    if (roles.length === 1) {
      return ROLE_CONFIG[roles[0]] ? ROLE_CONFIG[roles[0]].text : roles[0];
    }

    return roles
      .map(role => ROLE_CONFIG[role] ? ROLE_CONFIG[role].text : role)
      .join(" / ");
  }

  function updateCardRoleTagsForSelectedAuthor() {
    const app = document.getElementById("publicationApp");
    const isMultiAuthorConcern = AUTHORS_CONCERN.length >= 2;

    if (app) {
      app.classList.toggle("multi-author-concern", isMultiAuthorConcern);
      app.classList.toggle("author-selected", isMultiAuthorConcern && !!selectedAuthorSlug);
    }

    const items = Array.from(document.querySelectorAll("#itemContainer .filterItem"));

    items.forEach(item => {
      const tag = item.querySelector(".auto-tag");
      if (!tag) return;

      if (isMultiAuthorConcern && selectedAuthorSlug) {
        const authorRolesMap = parseAuthorRolesMap(item);
        const roles = authorRolesMap[selectedAuthorSlug] || [];
        const primaryRole = getPrimaryRole(roles);
        const roleCfg = ROLE_CONFIG[primaryRole] || ROLE_CONFIG["co-author"];

        tag.textContent = getRoleTagText(roles);
        tag.style.background = roleCfg.solid;

        item.style.setProperty("--pub-accent-solid", roleCfg.solid);
        item.style.setProperty("--pub-accent-bg", roleCfg.bg);
      } else {
        const primaryRole = item.dataset.primaryRole || "co-author";
        const roleCfg = ROLE_CONFIG[primaryRole] || ROLE_CONFIG["co-author"];

        tag.textContent = item.dataset.defaultTag || roleCfg.text;
        tag.style.background = roleCfg.solid;

        item.style.setProperty("--pub-accent-solid", roleCfg.solid);
        item.style.setProperty("--pub-accent-bg", roleCfg.bg);

    const label = document.getElementById("selectedAuthorRoleLabel");
    if (label) {
      label.textContent = selectedAuthorName
        ? "Role filters for " + selectedAuthorName
        : "Select an author";

  function getJournalMetric(journalName) {
    const target = normalizeJournalName(journalName);

    for (const key in JOURNAL_METRICS) {
      if (normalizeJournalName(key) === target) return JOURNAL_METRICS[key];
    }

    return null;
  }

  function isMetricHidden(value) {
    const text = String(value == null ? "" : value).trim();
    return !text || text === "#";
  }

  function formatImpactFactorText(value) {
    const text = String(value == null ? "" : value).trim();
    if (isMetricHidden(text)) return "";

    if (/^(if|impact\s*factor)/i.test(text)) {
      return text;
    }

    return "IF " + text;
  }

  function parseImpactFactorValue(value) {
    const text = String(value == null ? "" : value).trim();
    if (isMetricHidden(text)) return null;

    const match = text.replace(/,/g, "").match(/(\d+(?:\.\d+)?)/);
    if (!match) return null;

    const impactFactor = Number(match[1]);
    return Number.isFinite(impactFactor) ? impactFactor : null;
  }

  function formatJcrText(value) {
    const text = String(value == null ? "" : value).trim();
    if (isMetricHidden(text)) return "";
    return text;
  }

  function parseJcrMetricSummary(value) {
    const text = String(value == null ? "" : value).trim();
    const summary = {
      top5: false,
      top10: false,
      percentile: null,
      quartile: ""
    };

    if (isMetricHidden(text)) return summary;

    const normalized = text.replace(/,/g, "");
    const percentMatch = normalized.match(/(?:top\s*)?(\d+(?:\.\d+)?)\s*%/i) ||
      normalized.match(/percentile\s*:?\s*(\d+(?:\.\d+)?)/i);

    if (percentMatch) {
      const percent = Number(percentMatch[1]);
      if (Number.isFinite(percent)) {
        summary.percentile = percent;
        summary.top5 = percent <= 5;
        summary.top10 = percent <= 10;
      }
    }

    const quartileMatch = normalized.match(/\bQ\s*([1-4])\b/i) ||
      normalized.match(/\bquartile\s*([1-4])\b/i) ||
      normalized.match(/\b([1-4])(?:st|nd|rd|th)\s*quartile\b/i);

    if (quartileMatch) {
      summary.quartile = "Q" + quartileMatch[1];
    } else if (summary.top10) {
      summary.quartile = "Q1";
    }

    return summary;
  }

  function countJcrMetricSummary(summaries) {
    const counts = {
      top5: 0,
      top10: 0,
      q1: 0,
      q2: 0,
      q3: 0,
      q4: 0
    };

    summaries.forEach(summary => {
      if (!summary) return;

      if (summary.top5) counts.top5++;
      if (summary.top10) counts.top10++;

      const quartile = String(summary.quartile || "").toLowerCase();
      if (Object.prototype.hasOwnProperty.call(counts, quartile)) {
        counts[quartile]++;
      }
    });

    return counts;
  }

  function getPaperJcrMetricSummary(paper) {
    const metric = getJournalMetric(paper.journal);
    return metric ? parseJcrMetricSummary(metric.jcr) : parseJcrMetricSummary("");
  }

  function getRoleSortValue(paper) {
    const priority = {
      corresponding: 0,
      first: 1,
      "co-first": 2,
      "co-author": 3
    };

    return Object.prototype.hasOwnProperty.call(priority, paper.primaryRole)
      ? priority[paper.primaryRole]
      : priority["co-author"];
  }

  function getRankSortValue(paper) {
    const summary = getPaperJcrMetricSummary(paper);
    const hasPercentile = summary.percentile !== null && summary.percentile !== "";
    const percentile = hasPercentile ? Number(summary.percentile) : NaN;

    if (Number.isFinite(percentile)) return percentile;

    if (summary.top5) return 5;
    if (summary.top10) return 10;

    const quartile = String(summary.quartile || "").toUpperCase();
    if (quartile === "Q1") return 101;
    if (quartile === "Q2") return 102;
    if (quartile === "Q3") return 103;
    if (quartile === "Q4") return 104;

    return 999;
  }

  function getRankSortLabel(paper) {
    const value = getRankSortValue(paper);
    return Number.isFinite(value) ? String(value) : "999";
  }

  function getImpactFactorSortValue(paper) {
    const metric = getJournalMetric(paper.journal);
    if (!metric) return -1;

    const impactFactor = parseImpactFactorValue(metric.impactFactor);
    return impactFactor == null ? -1 : impactFactor;
  }

  function getImpactFactorSortLabel(paper) {
    const value = getImpactFactorSortValue(paper);
    return Number.isFinite(value) ? String(value) : "-1";
  }

  function getCitationSortValue(paper) {
    const count = Number(paper.citationSortCount);
    return Number.isFinite(count) ? count : -1;
  }

  function getVolumeSortValue(paper) {
    const match = String(paper && paper.volume || "").replace(/,/g, "").match(/(\d+(?:\.\d+)?)/);
    if (!match) return null;

    const volume = Number(match[1]);
    return Number.isFinite(volume) ? volume : null;
  }

  function comparePapersByYear(a, b) {
    const yearA = getYearSortValue(a.year);
    const yearB = getYearSortValue(b.year);
    if (yearA !== yearB) return yearB - yearA;

    if (normalizeJournalName(a.journal) && normalizeJournalName(a.journal) === normalizeJournalName(b.journal)) {
      const volumeA = getVolumeSortValue(a);
      const volumeB = getVolumeSortValue(b);
      if (volumeA != null && volumeB != null && volumeA !== volumeB) return volumeB - volumeA;
    }

    const rowDiff = Number(b.sourceRowIndex || 0) - Number(a.sourceRowIndex || 0);
    if (rowDiff) return rowDiff;
    return String(a.title || "").localeCompare(String(b.title || ""));
  }

  function isInProgressYear(year) {
    const normalized = String(year == null ? "" : year).trim().toLowerCase();
    return normalized === "in progress" || normalized === "0";
  }

  function getDisplayYear(year) {
    const normalized = String(year == null ? "" : year).trim();
    if (isInProgressYear(normalized)) return "In Progress";
    return normalized || "Unknown";
  }

  function getYearSortValue(year) {
    if (isInProgressYear(year)) return Number.MAX_SAFE_INTEGER;
    return Number(year) || 0;
  }

  function getYearLabelClass(year) {
    return isInProgressYear(year)
      ? "year-label year-label-in-progress"
      : "year-label year-label-year";
  }

  function getCardYearDetail(year) {
    return isInProgressYear(year) ? "" : String(year || "").trim();
  }

  function comparePapersForCurrentSort(a, b) {
    if (currentSortBy === "role") {
      const roleDiff = getRoleSortValue(a) - getRoleSortValue(b);
      if (roleDiff) return roleDiff;
    } else if (currentSortBy === "rank") {
      const rankA = getRankSortValue(a);
      const rankB = getRankSortValue(b);
      const rankDiff = rankA - rankB;
      if (rankDiff) return rankDiff;
    } else if (currentSortBy === "if") {
      const ifDiff = getImpactFactorSortValue(b) - getImpactFactorSortValue(a);
      if (ifDiff) return ifDiff;
    } else if (currentSortBy === "cited") {
      const citationDiff = getCitationSortValue(b) - getCitationSortValue(a);
      if (citationDiff) return citationDiff;
    }

    return comparePapersByYear(a, b);
  }

  function getSortedPaperSignature() {
    return PAPERS.slice()
      .sort(comparePapersForCurrentSort)
      .map(paper => [normalizeDoi(paper.doi || ""), paper.title || "", getCitationSortValue(paper)].join(":"))
      .join("|");
  }

  function scheduleCitationSortRefresh() {
    if (currentSortBy !== "cited") return;

    clearTimeout(citationSortRefreshTimer);
    citationSortRefreshTimer = setTimeout(function () {
      const nextSignature = getSortedPaperSignature();
      if (nextSignature !== lastCitedSortSignature) {
        renderPublicationList();
      }
    }, 250);
  }

  function renderJcrMetricStats() {
    return `
      <span class="jcr-stat-group" title="Counts papers by the matched journal metric row for currently visible papers. Top 10% includes Top 5%; Top 5% and Top 10% also count as Q1.">
        <span class="jcr-stat-set">
          <span class="jcr-stat-category">Top JCR</span>
          <span class="jcr-stat"><span class="jcr-stat-label">Top 5%</span> <strong id="jcrTop5Count">0</strong></span>
          <span class="jcr-stat"><span class="jcr-stat-label">Top 10%</span> <strong id="jcrTop10Count">0</strong></span>
        </span>
        <span class="jcr-stat-set">
          <span class="jcr-stat-category">Quartile</span>
          <span class="jcr-stat"><span class="jcr-stat-label">Q1</span> <strong id="jcrQ1Count">0</strong></span>
          <span class="jcr-stat"><span class="jcr-stat-label">Q2</span> <strong id="jcrQ2Count">0</strong></span>
          <span class="jcr-stat"><span class="jcr-stat-label">Q3</span> <strong id="jcrQ3Count">0</strong></span>
          <span class="jcr-stat"><span class="jcr-stat-label">Q4</span> <strong id="jcrQ4Count">0</strong></span>
        </span>
      </span>
    `;
  }

  function formatJournalDetails(paper) {
    const parts = [];

    if (paper.volume) parts.push(paper.volume);
    if (paper.issue) parts.push("(" + paper.issue + ")");
    const cardYear = getCardYearDetail(paper.year);
    if (cardYear) parts.push(cardYear);
    if (paper.pages) parts.push(paper.pages);
    if (paper.articleNo) parts.push(paper.articleNo);

    return parts.join(", ");
  }

  function renderAuthors(paper) {
    const concernNames = paper.concernedAuthorsInPaper.map(normalizeName);

    return paper.authors.map(author => {
      const cleanAuthor = escapeHtml(author);
      const isConcern = concernNames.includes(normalizeName(author));
      const roles = getRoleForAuthor(author, paper);

      let suffix = "";
      if (roles.includes("co-first")) {
        suffix += '<span class="role-symbol-cofirst">†</span>';
      }
      if (roles.includes("corresponding")) {
        suffix += '<span class="role-symbol-corresponding">*</span>';
      }

      return (isConcern ? "<strong>" + cleanAuthor + "</strong>" : cleanAuthor) + suffix;
    }).join(", ");
  }

  function renderJournalMetricBadge(paper) {
    const metric = getJournalMetric(paper.journal);

    if (!paper.journal) return "";

    if (!metric) {
      return "";
    }

    const impactText = formatImpactFactorText(metric.impactFactor);
    const jcrText = formatJcrText(metric.jcr);
    const visibleParts = [];

    if (impactText) visibleParts.push(impactText);
    if (jcrText) visibleParts.push(jcrText);

    if (!visibleParts.length) {
      return "";
    }

    return `<span class="auto-journal-metric">${escapeHtml(visibleParts.join(", "))}</span>`;
  }

  function getJournalCoverImageCandidates(paper) {
    const metric = getJournalMetric(paper.journal);
    return metric ? getImageUrlCandidates(metric.coverImage) : [];
  }

  function renderJournalCover(paper) {
    const coverCandidates = getJournalCoverImageCandidates(paper);
    if (!coverCandidates.length) return "";

    const coverImage = coverCandidates[0];
    const altText = paper.journal ? paper.journal + " cover" : "Journal cover";

    return `
      <div class="journal-cover-box">
        <img src="${escapeHtml(coverImage)}"
             class="journal-cover-img"
             alt="${escapeHtml(altText)}"
             loading="lazy"
             data-cover-index="0"
             data-cover-candidates="${escapeHtml(JSON.stringify(coverCandidates))}"
             onerror="window.pubJournalCoverNext && window.pubJournalCoverNext(this);">
      </div>
    `;
  }

  function renderCitationLinks(paper) {
    const links = [];

    if (paper.risLink && paper.risLink !== "#") {
      links.push(`<a href="${escapeHtml(paper.risLink)}" target="_blank" rel="noopener noreferrer">RIS</a>`);
    }

    if (paper.bibtexLink && paper.bibtexLink !== "#") {
      links.push(`<a href="${escapeHtml(paper.bibtexLink)}" target="_blank" rel="noopener noreferrer">BibTeX</a>`);
    }

    if (paper.textLink && paper.textLink !== "#") {
      links.push(`<a href="${escapeHtml(paper.textLink)}" target="_blank" rel="noopener noreferrer">text</a>`);
    }

    return links.length ? `<svg class="cite-label-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M3 4h8v8c0 5-3 8-8 8v-2c3 0 5-2 5-5H3V4zm12 0h8v8c0 5-3 8-8 8v-2c3 0 5-2 5-5h-5V4z"/></svg><span class="cite-label">Cite:</span> ${links.join(", ")}` : "";
  }

  function renderFootnotes(paper) {
    const notes = [];

    if (paper.coFirstAuthor.length) {
      notes.push(`<span style="margin-right: 15px;"><span class="role-symbol-cofirst">†</span> Equally contributed</span>`);
    }

    if (paper.correspondingAuthor.length) {
      notes.push(`<span><span class="role-symbol-corresponding">*</span> Corresponding Author</span>`);
    }

    return notes.length ? `<div class="footnote-section">${notes.join(" ")}</div>` : "";
  }

  function getPaperThumbnailImageCandidates(paper) {
    return getImageUrlCandidates(paper.thumbnail);
  }

  function renderPaperThumbnail(paper) {
    const thumbnailCandidates = getPaperThumbnailImageCandidates(paper);
    if (!thumbnailCandidates.length) return "";

    const thumbnailImage = thumbnailCandidates[0];

    return `
      <div class="thumb-box">
        <img src="${escapeHtml(thumbnailImage)}"
             class="paper-img"
             alt=""
             loading="lazy"
             data-thumbnail-index="0"
             data-thumbnail-candidates="${escapeHtml(JSON.stringify(thumbnailCandidates))}"
             onerror="window.pubPaperThumbnailNext && window.pubPaperThumbnailNext(this);">
      </div>
    `;
  }

  function renderGraphicalAbstractButton(paper) {
    const thumbnailCandidates = getPaperThumbnailImageCandidates(paper);
    if (!paper.showThumbnail || !thumbnailCandidates.length) return "";

    return `
      <button type="button"
              class="graphical-abstract-button"
              data-graphical-abstract-title="${escapeHtml(paper.title)}"
              data-graphical-abstract-candidates="${escapeHtml(JSON.stringify(thumbnailCandidates))}"
              onclick="window.pubOpenGraphicalAbstractBubble(this)"
              aria-label="View graphical highlight for ${escapeHtml(paper.title)}">Graphical highlight</button>
    `;
  }

  function renderPaperCard(paper) {
    const roleCfg = ROLE_CONFIG[paper.primaryRole] || ROLE_CONFIG["co-author"];
    const roleClasses = paper.roles.map(role => " role-" + role).join("");
    const authorClasses = paper.authorSlugs.map(slug => " author-" + slug).join("");
    const doiUrl = paper.doiUrl || "#";
    const authorRolesMap = getAuthorRolesMap(paper);
    const jcrSummary = getPaperJcrMetricSummary(paper);
    const rankSortLabel = getRankSortLabel(paper);
    const impactFactorSortLabel = getImpactFactorSortLabel(paper);
    const cardDoiOpenTitle = getCardDoiOpenTitle();

    return `
      <div class="filterItem${roleClasses}${authorClasses}"
           data-doi="${escapeHtml(paper.doi)}"
           data-doi-url="${escapeHtml(doiUrl)}"
           data-roles="${escapeHtml(paper.roles.join(" "))}"
           data-authors="${escapeHtml(paper.authorSlugs.join(" "))}"
           data-author-roles="${escapeHtml(JSON.stringify(authorRolesMap))}"
           data-primary-role="${escapeHtml(paper.primaryRole)}"
           data-jcr-top5="${jcrSummary.top5 ? "1" : "0"}"
           data-jcr-top10="${jcrSummary.top10 ? "1" : "0"}"
           data-jcr-quartile="${escapeHtml(jcrSummary.quartile)}"
           data-rank-sort="${escapeHtml(rankSortLabel)}"
           data-if-sort="${escapeHtml(impactFactorSortLabel)}"
           data-default-tag="${escapeHtml(roleCfg.text)}"
           tabindex="0"
           role="link"
           aria-label="${escapeHtml(cardDoiOpenTitle)}: ${escapeHtml(doiUrl)}"
           title="${escapeHtml(cardDoiOpenTitle)}"
           style="--pub-accent-solid:${roleCfg.solid}; --pub-accent-bg:${roleCfg.bg}; box-shadow: 4px 0px 10px -4px ${roleCfg.color}, 0px 4px 10px rgba(0,0,0,0.06);">

        <div class="auto-tag" style="background:${roleCfg.solid};">${roleCfg.text}</div>

        ${renderPaperThumbnail(paper)}

        <div class="paper-content">
          <h3 class="paper-title">
            <a href="${escapeHtml(doiUrl)}" target="_blank" rel="noopener noreferrer">
              ${escapeHtml(paper.title)}
            </a>
          </h3>

          <p class="paper-authors">${renderAuthors(paper)}</p>

          <p class="paper-journal">
            <em class="journal-name">${escapeHtml(paper.journal)}</em>${formatJournalDetails(paper) ? ", " + escapeHtml(formatJournalDetails(paper)) + "." : "."}
            ${renderJournalMetricBadge(paper)}
            ${paper.doi ? `
              <span class="doi-line">
                <a href="${escapeHtml(doiUrl)}" target="_blank" rel="noopener noreferrer"><svg class="reference-link-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 3h6v6M10 14 21 3"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg><span class="reference-link-label">DOI:</span> ${escapeHtml(paper.doi)}</a>
              </span>
            ` : ""}
          </p>

          <div class="citation-links">
            ${renderCitationLinks(paper)}
            <div class="auto-citation-row">
              <span class="auto-citation-count is-loading" data-doi="${escapeHtml(paper.doi)}">Citations: loading...</span>
              <button type="button" class="abstract-button" data-doi="${escapeHtml(paper.doi)}" data-title="${escapeHtml(paper.title)}" data-local-abstract="${escapeHtml(paper.abstract)}">View abstract</button>
              ${renderGraphicalAbstractButton(paper)}
              ${renderPlumXWidget(paper)}
              ${renderAltmetricWidget(paper)}
            </div>
            ${renderFootnotes(paper)}
          </div>
        </div>

        ${renderJournalCover(paper)}
      </div>
    `;
  }

  function renderFilterButtons() {
    const showAuthorButtons = AUTHORS_CONCERN.length >= 2;

    const authorButtons = showAuthorButtons
      ? AUTHORS_CONCERN.map(name => {
          const slug = slugify(name);
          return `
            <button class="publication-filter-button" data-filter="author:${slug}" onclick="window.filterSelection('author:${slug}')">
              ${escapeHtml(name)}
            </button>
          `;
        }).join("")
      : "";

    const roleButtons = `
      <div class="publication-role-filter-group">
        ${showAuthorButtons ? `<span id="selectedAuthorRoleLabel" class="publication-selected-author-label">Select an author</span>` : ""}
        <button class="publication-filter-button" data-filter="role:corresponding" onclick="window.filterSelection('role:corresponding')">
          Corresponding Author <span class="role-count" data-role-count="corresponding">0</span>
        </button>
        <button class="publication-filter-button" data-filter="role:first" onclick="window.filterSelection('role:first')">
          First Author <span class="role-count" data-role-count="first">0</span>
        </button>
        <button class="publication-filter-button" data-filter="role:co-first" onclick="window.filterSelection('role:co-first')">
          Co-first Author <span class="role-count" data-role-count="co-first">0</span>
        </button>
        <button class="publication-filter-button" data-filter="role:co-author" onclick="window.filterSelection('role:co-author')">
          Co-Author <span class="role-count" data-role-count="co-author">0</span>
        </button>
      </div>
    `;

    return `
      <div class="publication-filter-bar">
        <button class="publication-filter-button active" data-filter="all" onclick="window.filterSelection('all')">
          Show All <span class="role-count" data-role-count="all">0</span>
        </button>
        ${renderMobileImageToggleButton()}
        ${authorButtons}
        ${roleButtons}
        ${renderSortControl()}
      </div>
    `;
  }

  function renderSortControl() {
    return `
      <label class="publication-sort-control">
        <span>Sort by:</span>
        <select class="publication-sort-select" onchange="window.changePublicationSort(this.value)">
          <option value="year" ${currentSortBy === "year" ? "selected" : ""}>Year</option>
          <option value="role" ${currentSortBy === "role" ? "selected" : ""}>Role</option>
          <option value="rank" ${currentSortBy === "rank" ? "selected" : ""}>Rank</option>
          <option value="if" ${currentSortBy === "if" ? "selected" : ""}>IF</option>
          <option value="cited" ${currentSortBy === "cited" ? "selected" : ""}>Cited</option>
        </select>
      </label>
    `;
  }

  function renderCitationSourceControl() {
    return `
      <span class="citation-source-control">
        <span class="citation-source-label">Source</span>
        <select id="citationSourceSelect"
                class="citation-source-select"
                onchange="changeCitationSource(this.value)">
          <option value="crossref" ${citationSourceMode === "crossref" ? "selected" : ""}>Crossref</option>
          <option value="openalex" ${citationSourceMode === "openalex" ? "selected" : ""}>OpenAlex</option>
        </select>
      </span>
    `;
  }

  function renderPublicationList() {
    const app = document.getElementById("publicationApp");
    applyMobileImageDisplayMode();

    const sortedPapers = PAPERS.slice().sort(comparePapersForCurrentSort);
    if (currentSortBy === "cited") {
      lastCitedSortSignature = sortedPapers
        .map(paper => [normalizeDoi(paper.doi || ""), paper.title || "", getCitationSortValue(paper)].join(":"))
        .join("|");
    }

    const yearSections = currentSortBy === "year"
      ? (function () {
          const grouped = new Map();

          sortedPapers.forEach(paper => {
            const year = getDisplayYear(paper.year);
            if (!grouped.has(year)) grouped.set(year, []);
            grouped.get(year).push(paper);
          });

          return Array.from(grouped.entries()).map(([year, papers]) => `
            <div class="yearSection" data-year="${escapeHtml(year)}">
              <div class="yearHeader">
                <h2><span class="${getYearLabelClass(year)}">${escapeHtml(year)}</span></h2>
                <span class="year-count">0 papers</span>
              </div>
              ${papers.map(renderPaperCard).join("")}
            </div>
          `).join("");
        })()
      : `
        <div class="yearSection publication-sorted-card-section" data-sort-by="${escapeHtml(currentSortBy)}">
          ${sortedPapers.map(renderPaperCard).join("")}
        </div>
      `;

    app.innerHTML = `
      <div class="publication-summary-box">
        <div class="publication-summary-title">Publications by Nhat-Tam Nguyen</div>
        <div class="publication-summary-metrics">
          <div class="publication-metric-card paper-metric">
            <span class="publication-metric-label">Total Papers</span>
            <span class="paper-total-stat"><span class="paper-total-label">Total</span> <strong id="totalPaperCount">0</strong></span>
            ${renderJcrMetricStats()}
          </div>

          <div class="publication-metric-card citation-metric" title="Citation, h-index, and i10-index are calculated from currently visible papers using the selected source.">
            <span class="publication-metric-label">Citation Metrics</span>

            <span class="citation-stat-group">
              <span class="citation-stat">Cites <strong id="totalCitationCount">loading...</strong></span>
              <span class="citation-stat">h-index <strong id="hIndexCount">loading...</strong></span>
              <span class="citation-stat">i10-index <strong id="i10IndexCount">loading...</strong></span>
            </span>

            ${renderCitationSourceControl()}
          </div>
        </div>
      </div>

      ${renderFilterButtons()}

      <div id="itemContainer">
        ${yearSections}
      </div>
    `;

    updateMobileImageToggleButton();
    initCardsAfterRender();
  }

  function initCardsAfterRender() {
    checkThumbnails();
    enablePaperCardDoiLinks();
    initAbstractPopup();
    enableAbstractButtons();
    window.filterSelection(currentFilter || "all");
    updateCardRoleTagsForSelectedAuthor();
    updateRoleFilterCounts();
    initPlumXWidgets();
    initAltmetricWidgets();
    updatePublicationCitationCounts();
    scheduleMobileFrameResizeFromPublicationPage();
  }

  window.changePublicationSort = function (sortBy) {
    currentSortBy = ["year", "role", "rank", "if", "cited"].includes(sortBy) ? sortBy : "year";
    renderPublicationList();
  };

  function checkThumbnails() {
    const images = document.getElementsByClassName("paper-img");

    for (let img of images) {
      const src = img.getAttribute("src");
      const thumbBox = img.closest(".thumb-box");
      if (!thumbBox) continue;

      if (!src || src === "#" || src === "https://placeholder.com") {
        thumbBox.style.display = "none";
      }
    }
  }

  function getGraphicalAbstractBubble() {
    let bubble = document.getElementById("graphicalAbstractBubble");
    if (bubble) return bubble;

    bubble = document.createElement("div");
    bubble.id = "graphicalAbstractBubble";
    bubble.className = "graphical-abstract-bubble";
    bubble.setAttribute("data-close-tooltip", "Double-click to close");
    bubble.addEventListener("dblclick", window.pubCloseGraphicalAbstractBubble);
    setupCloseHoverTooltip(bubble);
    bubble.innerHTML = `
      <div class="graphical-abstract-bubble-header">
        <p class="graphical-abstract-bubble-title" id="graphicalAbstractBubbleTitle">Graphical abstract</p>
        <button class="graphical-abstract-bubble-close"
                type="button"
                onclick="window.pubCloseGraphicalAbstractBubble()"
                aria-label="Close graphical abstract preview">&times;</button>
      </div>
      <div class="graphical-abstract-bubble-body">
        <img class="graphical-abstract-bubble-img"
             alt="Graphical abstract preview"
             data-graphical-abstract-index="0"
             onerror="window.pubGraphicalAbstractNext && window.pubGraphicalAbstractNext(this);">
      </div>
    `;
    document.body.appendChild(bubble);
    return bubble;
  }

  function positionGraphicalAbstractBubble(bubble, anchor) {
    const rect = anchor.getBoundingClientRect();
    const margin = 12;
    const width = Math.min(760, window.innerWidth - margin * 2);
    const height = Math.min(Math.round(window.innerHeight * 0.80), 820);
    const left = Math.max(margin, Math.min(rect.left, window.innerWidth - width - margin));
    const belowTop = rect.bottom + 8;
    const aboveTop = rect.top - height - 8;
    const top = belowTop + height <= window.innerHeight - margin
      ? belowTop
      : Math.max(margin, aboveTop);

    bubble.style.width = width + "px";
    bubble.style.left = left + "px";
    bubble.style.top = top + "px";
  }

  window.pubGraphicalAbstractNext = function (img) {
    if (!img) return;

    let candidates = [];
    try {
      candidates = JSON.parse(img.getAttribute("data-graphical-abstract-candidates") || "[]");
    } catch (error) {
      candidates = [];
    }

  function shouldIgnoreCardDoiClick(event) {
    if (!event || event.defaultPrevented) return true;

    const target = event.target;
    if (!target) return false;

    if (target.closest("a, button, input, textarea, select, label, summary, [role='button'], [contenteditable='true']")) {

  function enablePaperCardDoiLinks() {
    const items = Array.from(document.querySelectorAll("#itemContainer .filterItem"));
    const TOUCH_TAP_MOVE_PX = 10;
    const TOUCH_TAP_MAX_MS = 450;
    let touchStart = {
      item: null,
      x: 0,
      y: 0,
      time: 0,
      ignored: false,
      moved: false
    };

    for (const item of items) {
      if (item.dataset.cardDoiBound === "true") continue;
      item.dataset.cardDoiBound = "true";

      function openCardDoi(event) {
        if (shouldIgnoreCardDoiClick(event)) return;

        const url = item.dataset.doiUrl;
        if (url && url !== "#") {
          window.open(url, "_blank", "noopener");
        }
      }

      item.addEventListener("click", function (event) {
        if (getCardDoiOpenClickMode() !== "single") return;
        openCardDoi(event);
      });

      item.addEventListener("dblclick", function (event) {
        if (getCardDoiOpenClickMode() !== "double") return;
        openCardDoi(event);
      });

      item.addEventListener("touchstart", function (event) {
        if (!event.touches || event.touches.length !== 1) return;

        const touch = event.touches[0];
        touchStart = {
          item: item,
          x: touch.clientX,
          y: touch.clientY,
          time: Date.now(),
          ignored: shouldIgnoreCardDoiClick(event),
          moved: false
        };
      }, { passive: true });

      item.addEventListener("touchmove", function (event) {
        if (touchStart.item !== item || !event.touches || event.touches.length !== 1) return;

        const touch = event.touches[0];
        const dx = Math.abs(touch.clientX - touchStart.x);
        const dy = Math.abs(touch.clientY - touchStart.y);

        if (dx > TOUCH_TAP_MOVE_PX || dy > TOUCH_TAP_MOVE_PX) {
          touchStart.moved = true;
        }
      }, { passive: true });

      item.addEventListener("touchend", function (event) {
        if (!event.changedTouches || event.changedTouches.length !== 1) return;
        if (touchStart.item !== item || touchStart.ignored) return;

        const touch = event.changedTouches[0];
        const dx = Math.abs(touch.clientX - touchStart.x);
        const dy = Math.abs(touch.clientY - touchStart.y);
        const elapsed = Date.now() - touchStart.time;
        const moved = touchStart.moved || dx > TOUCH_TAP_MOVE_PX || dy > TOUCH_TAP_MOVE_PX;

        touchStart.item = null;

        if (moved || elapsed > TOUCH_TAP_MAX_MS) return;

        event.preventDefault();
        openCardDoi(event);
      }, { passive: false });

      item.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (shouldIgnoreCardDoiClick(event)) return;

        event.preventDefault();

        const url = item.dataset.doiUrl;
        if (url && url !== "#") {
          window.open(url, "_blank", "noopener");
        }
      });
    }
  }

  function positionAbstractPopup(popup, anchor) {
    const margin = 10;
    const fallbackTop = Math.max(margin, Math.round(window.innerHeight * 0.18));
    const fallbackLeft = margin;

    if (!anchor || !anchor.getBoundingClientRect) {
      popup.style.top = fallbackTop + "px";
      popup.style.left = fallbackLeft + "px";
      return;
    }

    const anchorRect = anchor.getBoundingClientRect();
    const popupWidth = Math.min(420, window.innerWidth - margin * 2);
    const popupHeight = Math.min(440, Math.round(window.innerHeight * 0.56));
    const opensAbove = anchorRect.bottom + popupHeight + margin > window.innerHeight && anchorRect.top > popupHeight + margin;
    const top = opensAbove ? anchorRect.top - popupHeight - margin : anchorRect.bottom + margin;
    const preferredLeft = anchorRect.left;
    const left = Math.min(Math.max(margin, preferredLeft), Math.max(margin, window.innerWidth - popupWidth - margin));

    popup.style.top = Math.max(margin, Math.round(top)) + "px";
    popup.style.left = Math.round(left) + "px";
  }

      const text = element.getAttribute("data-close-tooltip") || "";
      if (!text) return;

      const tooltip = getCloseHoverTooltip();
      tooltip.textContent = text;
      tooltip.style.display = "block";

      const offset = 12;
      const width = tooltip.offsetWidth || 0;
      const height = tooltip.offsetHeight || 0;
      const left = Math.min(event.clientX + offset, window.innerWidth - width - offset);
      const top = Math.min(event.clientY + offset, window.innerHeight - height - offset);

      tooltip.style.left = Math.max(offset, left) + "px";
      tooltip.style.top = Math.max(offset, top) + "px";
    });

    element.addEventListener("mouseleave", function () {
      const tooltip = document.getElementById("closeHoverTooltip");
      if (tooltip) tooltip.style.display = "none";

  function abstractFromOpenAlexIndex(index) {
    if (!index || typeof index !== "object") return "";

    const words = [];

    Object.keys(index).forEach(word => {
      const positions = Array.isArray(index[word]) ? index[word] : [];
      positions.forEach(position => {
        if (Number.isFinite(position)) words[position] = word;
      });
    });

    return words.filter(Boolean).join(" ").trim();
  }

  async function fetchOpenAlexAbstract(doi) {
    let url = "https://api.openalex.org/works/doi:" + encodeURIComponent(doi) + "?select=doi,title,abstract_inverted_index";

    if (CONFIG.openAlexApiKey && CONFIG.openAlexApiKey.trim()) {
      url += "&api_key=" + encodeURIComponent(CONFIG.openAlexApiKey.trim());
    }

    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error("OpenAlex abstract request failed: HTTP " + response.status);
    }

    const data = await response.json();
    const abstractText = abstractFromOpenAlexIndex(data.abstract_inverted_index);

    if (!abstractText) {
      throw new Error("OpenAlex abstract unavailable");
    }

    return {
      abstract: abstractText,
      source: "OpenAlex"
    };
  }

  function extractAbstractFromReaderText(text) {
    const raw = String(text == null ? "" : text).replace(/\r/g, "");
    const abstractMatch = raw.match(/(?:^|\n)#{1,6}\s*Abstract\s*\n+([\s\S]*?)(?=\n#{1,6}\s+|\n(?:Graphical abstract|Introduction|Section snippets|Keywords)\b|$)/i);
    const fallbackMatch = raw.match(/(?:^|\n)Abstract\s*\n+([\s\S]*?)(?=\n[A-Z][^\n]{0,80}\n|$)/i);
    const abstractText = abstractMatch ? abstractMatch[1] : (fallbackMatch ? fallbackMatch[1] : "");

    return abstractText
      .replace(/\n{2,}/g, "\n")
      .replace(/\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/^\s*[-*]\s*/gm, "")
      .trim();
  }

  async function fetchReaderAbstract(doi) {
    const doiUrl = "https://doi.org/" + doi;
    const url = "https://r.jina.ai/" + doiUrl;

    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "text/plain" }
    });

    if (!response.ok) {
      throw new Error("Reader abstract request failed: HTTP " + response.status);
    }

    const text = await response.text();
    const abstractText = extractAbstractFromReaderText(text);

    if (!abstractText) {
      throw new Error("Reader abstract unavailable");
    }

    return {
      abstract: abstractText,
      source: "DOI landing page"
    };
  }

    try {

    return await fetchCrossrefAbstract(doi);

  function calculateHIndex(citationCounts) {
    const sorted = citationCounts
      .filter(count => Number.isFinite(count))
      .sort((a, b) => b - a);

    let h = 0;

    for (let i = 0; i < sorted.length; i++) {
      if (sorted[i] >= i + 1) {
        h = i + 1;
      } else {
        break;
      }
    }

    return h;
  }

  function updateRoleFilterCounts() {
    const roles = ["corresponding", "first", "co-first", "co-author"];
    const items = Array.from(document.querySelectorAll("#itemContainer .filterItem"));

    let allCount = 0;

    items.forEach(item => {
      if (!itemBelongsToCurrentAuthorBasis(item)) return;
      allCount++;
    });

    document.querySelectorAll(`[data-role-count="all"]`).forEach(el => {
      el.innerText = allCount;

        if (itemHasRoleForCurrentAuthorBasis(item, role)) count++;

      selectedAuthorName = "";

      selectedAuthorName = AUTHORS_CONCERN.find(name => slugify(name) === selectedAuthorSlug) || "";

        let visible = false;

        if (currentFilter === "all") {
          visible = true;
        } else if (currentFilter.startsWith("author:")) {
          visible = (item.dataset.authors || "").split(/\s+/).includes(selectedAuthorSlug);
        } else if (currentFilter.startsWith("role:")) {
          const role = currentFilter.replace("role:", "");

          if (isMultiAuthorConcern && selectedAuthorSlug) {
            const authorRolesMap = parseAuthorRolesMap(item);
            const selectedAuthorRoles = authorRolesMap[selectedAuthorSlug] || [];
            visible = selectedAuthorRoles.includes(role);

  function setItemCitationState(item, status, count, source) {
    item.dataset.citationStatus = status || "";

    if (typeof count === "number") {
      item.dataset.citationCount = String(count);
    } else {
      delete item.dataset.citationCount;
    }

    if (source) {
      item.dataset.citationSource = source;
    } else {
      delete item.dataset.citationSource;
    }

    const doi = normalizeDoi(item.dataset.doi || "");
    if (doi && typeof count === "number" && Number.isFinite(count)) {
      const paper = PAPERS.find(entry => normalizeDoi(entry.doi || "") === doi);
      if (paper) paper.citationSortCount = count;
    }

    scheduleCitationSortRefresh();

    updateVisibleTotalCitations();
  }

  function updateVisibleTotalCitations() {
    const visibleItems = Array.from(document.querySelectorAll("#itemContainer .filterItem"))
      .filter(item => !item.classList.contains("pub-hidden"));

    let total = 0;
    let pending = 0;
    const counts = [];

    for (const item of visibleItems) {
      if (item.dataset.citationStatus === "loading") {
        pending++;
      }

      const count = Number(item.dataset.citationCount);
      if (Number.isFinite(count)) {
        total += count;
        counts.push(count);
      }
    }

    const hIndex = calculateHIndex(counts);
    const i10Index = calculateI10Index(counts);

    if (visibleItems.length === 0) {
      setTextById("totalCitationCount", "0");
      setTextById("hIndexCount", "0");
      setTextById("i10IndexCount", "0");
    } else if (pending > 0) {
      setTextById("totalCitationCount", total + "+");
      setTextById("hIndexCount", hIndex + "+");
      setTextById("i10IndexCount", i10Index + "+");
    } else if (counts.length === 0) {
      setTextById("totalCitationCount", "unavailable");
      setTextById("hIndexCount", "unavailable");
      setTextById("i10IndexCount", "unavailable");
    } else {
      setTextById("totalCitationCount", String(total));
      setTextById("hIndexCount", String(hIndex));
      setTextById("i10IndexCount", String(i10Index));
    }
  }

  function scheduleMobileFrameResizeFromPublicationPage() {
    if (typeof window.__publicationScheduleMobileFrameResize === "function") {
      window.__publicationScheduleMobileFrameResize();
    }
  }

  async function fetchCrossrefCitationCount(doi) {
    const url = "https://api.crossref.org/works/" + encodeURIComponent(doi);

    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error("Crossref request failed: HTTP " + response.status);
    }

    const data = await response.json();
    const count = data && data.message ? data.message["is-referenced-by-count"] : null;

    if (typeof count !== "number") {
      throw new Error("Crossref citation count unavailable");
    }

    return {
      count: count,
      source: "Crossref"
    };
  }

  async function fetchOpenAlexCitationCount(doi) {
    let url = "https://api.openalex.org/works/doi:" + encodeURIComponent(doi) + "?select=doi,cited_by_count";

    if (CONFIG.openAlexApiKey && CONFIG.openAlexApiKey.trim()) {
      url += "&api_key=" + encodeURIComponent(CONFIG.openAlexApiKey.trim());
    }

    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error("OpenAlex request failed: HTTP " + response.status);
    }

    const data = await response.json();

    if (typeof data.cited_by_count !== "number") {
      throw new Error("OpenAlex citation count unavailable");
    }

    return {
      count: data.cited_by_count,
      source: "OpenAlex"
    };
  }

  async function fetchCitationCount(doi) {
    if (citationSourceMode === "openalex") {
      return await fetchOpenAlexCitationCount(doi);
    }

    return await fetchCrossrefCitationCount(doi);
  }

  window.changeCitationSource = function (source) {
    citationSourceMode = source === "openalex" ? "openalex" : "crossref";

    const select = document.getElementById("citationSourceSelect");
    if (select) {
      select.value = citationSourceMode;
    }

    const items = Array.from(document.querySelectorAll("#itemContainer .filterItem"));

    items.forEach(item => {
      delete item.dataset.citationStatus;
      delete item.dataset.citationCount;
      delete item.dataset.citationSource;
      delete item.dataset.citationDoi;

      const badge = item.querySelector(".auto-citation-count");
      if (badge) {
        setCitationBadgeState(badge, "Citations: loading...", "is-loading");
      }
    });

    setTextById("totalCitationCount", "loading...");
    setTextById("hIndexCount", "loading...");
    setTextById("i10IndexCount", "loading...");

    updatePublicationCitationCounts();
  };

  async function updatePublicationCitationCounts() {
    const items = Array.from(document.querySelectorAll("#itemContainer .filterItem"));

    for (const item of items) {
      const doi = normalizeDoi(item.dataset.doi || "");
      const badge = item.querySelector(".auto-citation-count");

      if (!doi) {
        setItemCitationState(item, "missing", null, null);
        continue;
      }

      if (item.dataset.citationDoi === doi && item.dataset.citationStatus === "ready") {
        continue;
      }

      item.dataset.citationDoi = doi;

      const cached = getCachedCitation(doi);
      if (cached) {
        setCitationBadgeState(badge, "Citations: " + cached.count + " (" + cached.source + ")", "");
        setItemCitationState(item, "ready", cached.count, cached.source);
        continue;
      }

      if (item.dataset.citationStatus === "loading") {
        continue;
      }

      setCitationBadgeState(badge, "Citations: loading...", "is-loading");
      setItemCitationState(item, "loading", null, null);

      try {
        const citationInfo = await fetchCitationCount(doi);
        setCachedCitation(doi, citationInfo);
        setCitationBadgeState(badge, "Citations: " + citationInfo.count + " (" + citationInfo.source + ")", "");
        setItemCitationState(item, "ready", citationInfo.count, citationInfo.source);
      } catch (error) {
        console.warn("Citation update failed for DOI:", doi, error);
        setCitationBadgeState(badge, "Citations: unavailable", "is-error");
        setItemCitationState(item, "error", null, null);
      }
    }

    updateVisibleTotalCitations();
  }

  async function initPublicationPage() {
    const app = document.getElementById("publicationApp");
    applyMobileImageDisplayMode();

    app.innerHTML = `
      <div class="publication-summary-box">
        <div class="publication-summary-title">Publications by Nhat-Tam Nguyen</div>
        <div class="publication-summary-metrics">
          <div class="publication-metric-card paper-metric">
            <span class="publication-metric-label">Total Papers</span>
            <span class="paper-total-stat"><span class="paper-total-label">Total</span> <strong id="totalPaperCount">loading...</strong></span>
            ${renderJcrMetricStats()}
          </div>

          <div class="publication-metric-card citation-metric">
            <span class="publication-metric-label">Citation Metrics</span>

            <span class="citation-stat-group">
              <span class="citation-stat">Cites <strong id="totalCitationCount">loading...</strong></span>
              <span class="citation-stat">h-index <strong id="hIndexCount">loading...</strong></span>
              <span class="citation-stat">i10-index <strong id="i10IndexCount">loading...</strong></span>
            </span>

            ${renderCitationSourceControl()}
          </div>
        </div>
      </div>
      <div class="load-error">Loading publication data ...</div>
    `;

    try {
      const [paperRows, metricRows, concernRows] = await Promise.all([
        fetchSheetRows(CONFIG.papersSheetName),
        fetchSheetRows(CONFIG.journalMetricsSheetName),
        fetchSheetRows(CONFIG.authorsConcernSheetName)
      ]);

      AUTHORS_CONCERN = parseAuthorsConcernRows(concernRows);

      JOURNAL_METRICS = {};
      metricRows.map(parseJournalMetricRow).forEach(metric => {
        if (metric.journal) {
          JOURNAL_METRICS[metric.journal] = metric;
        }
      });

      PAPERS = paperRows
        .map((row, index) => parsePaperRow(Object.assign({}, row, { sourceRowIndex: index })))
        .filter(paper => paper.enabled && paper.title && paper.authors.length);

      renderPublicationList();
    } catch (error) {
      console.error(error);
      app.innerHTML = `
        <div class="load-error">
          <strong>Publication data could not be loaded.</strong><br>
          Please check that the Google Sheet is shared as “Anyone with the link can view” and that the sheet names are exactly
          <strong>Papers</strong>, <strong>AuthorsConcern</strong>, and <strong>JournalMetrics</strong>.<br>
          Error: ${escapeHtml(error.message || error)}<br><br>
          If this file is still an uploaded Excel file, open it in Google Sheets and save/convert it as a native Google Sheet.
        </div>
      `;
    }
  }

  function enableMobileScrollHandoffOnly() {
    const mobileQuery = window.matchMedia("(max-width: 768px)");
    const BOUNDARY_EPS = 3;
    const HANDOFF_THRESHOLD = 6;
    const HANDOFF_EDGE_ZONE = 90;
    const MOBILE_FRAME_EXTRA_SPACE = 500;
    let lastTouchY = 0;
    let frameExpanded = false;
    let resizeTimer = null;

    function isMobile() {
      return mobileQuery.matches;
    }

    function getScroller() {
      return document.scrollingElement || document.documentElement || document.body;
    }

    function getContentHeight() {
      const body = document.body;
      const html = document.documentElement;
      const container = document.getElementById("itemContainer");

      return Math.max(
        body ? body.scrollHeight : 0,
        body ? body.offsetHeight : 0,
        html ? html.scrollHeight : 0,
        html ? html.offsetHeight : 0,
        container ? container.getBoundingClientRect().bottom + 24 : 0
      );
    }

    function scheduleMobileFrameResize() {
      if (!isMobile()) return;

      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        tryResizeContainingFrame();
      }, 80);
    }

    function scheduleMobileFrameResizeSeries() {
      if (!isMobile()) return;

      tryResizeContainingFrame();
      scheduleMobileFrameResize();
      window.requestAnimationFrame(tryResizeContainingFrame);
      setTimeout(tryResizeContainingFrame, 250);
      setTimeout(tryResizeContainingFrame, 800);
      setTimeout(tryResizeContainingFrame, 1600);
    }

    function tryResizeContainingFrame() {
      if (!isMobile()) return false;

      try {
        if (!window.frameElement) return false;

        const nextHeight = Math.ceil(getContentHeight() + MOBILE_FRAME_EXTRA_SPACE);
        if (!nextHeight || nextHeight < 100) return false;

        window.frameElement.style.height = nextHeight + "px";
        window.frameElement.style.minHeight = nextHeight + "px";
        window.frameElement.style.overflow = "visible";
        window.frameElement.setAttribute("scrolling", "no");
        document.documentElement.style.overflow = "visible";
        document.body.style.overflow = "visible";
        document.body.style.minHeight = nextHeight + "px";

        frameExpanded = true;
        return true;
      } catch (error) {
        frameExpanded = false;
        return false;
      }
    }

    function atTop() {
      const scroller = getScroller();
      return scroller.scrollTop <= BOUNDARY_EPS;
    }

    function atBottom() {
      const scroller = getScroller();
      return scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - BOUNDARY_EPS;
    }

    function passScrollToWebsite(deltaY) {
      if (!isMobile() || !deltaY) return false;

      let moved = false;

      try {
        const targetWindow = window.parent && window.parent !== window ? window.parent : window;
        targetWindow.scrollBy({ top: deltaY, left: 0, behavior: "auto" });
        moved = true;
      } catch (error) {
        moved = false;
      }

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "PUBLICATION_SCROLL_HANDOFF",
            source: "publication-list",
            deltaY: deltaY
          }, "*");
        }
      } catch (error) {}

      return moved;
    }

    function hasScrollableInnerPage() {
      const scroller = getScroller();
      return scroller.scrollHeight > scroller.clientHeight + BOUNDARY_EPS;
    }

    function getRemainingBottomScroll() {
      const scroller = getScroller();
      return Math.max(0, scroller.scrollHeight - scroller.clientHeight - scroller.scrollTop);
    }

    function shouldHandoff(deltaY) {
      if (!isMobile()) return false;
      if (frameExpanded) return false;
      if (!hasScrollableInnerPage()) return true;
      if (deltaY > 0 && getRemainingBottomScroll() <= HANDOFF_EDGE_ZONE) return true;
      if (deltaY < 0 && getScroller().scrollTop <= HANDOFF_EDGE_ZONE) return true;
      return false;
    }

    function handoffEdgeScroll(deltaY) {
      if (!isMobile() || !deltaY) return false;

      const scroller = getScroller();
      let parentDelta = deltaY;

      if (hasScrollableInnerPage()) {
        if (deltaY > 0) {
          const remaining = getRemainingBottomScroll();
          const innerDelta = Math.min(deltaY, remaining);
          if (innerDelta > 0) {
            scroller.scrollTop += innerDelta;
            parentDelta = deltaY - innerDelta;
          }
        } else if (deltaY < 0) {
          const remaining = scroller.scrollTop;
          const innerDelta = Math.min(Math.abs(deltaY), remaining);
          if (innerDelta > 0) {
            scroller.scrollTop -= innerDelta;
            parentDelta = deltaY + innerDelta;
          }
        }
      }

      if (Math.abs(parentDelta) < 1) return true;
      return passScrollToWebsite(parentDelta);
    }

    function onWheel(event) {
      if (!shouldHandoff(event.deltaY)) return;

      if (handoffEdgeScroll(event.deltaY)) {
        event.preventDefault();
      }
    }

    function onTouchStart(event) {
      if (!isMobile() || !event.touches || event.touches.length === 0) return;
      tryResizeContainingFrame();
      lastTouchY = event.touches[0].clientY;
    }

    function onTouchMove(event) {
      if (!isMobile() || !event.touches || event.touches.length === 0) return;

      const currentY = event.touches[0].clientY;
      const deltaY = lastTouchY - currentY;
      lastTouchY = currentY;

      if (Math.abs(deltaY) < HANDOFF_THRESHOLD || !shouldHandoff(deltaY)) return;

      if (handoffEdgeScroll(deltaY)) {
        event.preventDefault();
      }
    }

    document.addEventListener("wheel", onWheel, { passive: false, capture: true });
    document.addEventListener("touchstart", onTouchStart, { passive: true, capture: true });
    document.addEventListener("touchmove", onTouchMove, { passive: false, capture: true });
    window.addEventListener("resize", scheduleMobileFrameResize, { passive: true });
    window.addEventListener("load", scheduleMobileFrameResizeSeries, { passive: true });
    window.__publicationScheduleMobileFrameResize = scheduleMobileFrameResizeSeries;

    if ("ResizeObserver" in window) {
      const app = document.getElementById("publicationApp");
      if (app) {
        const observer = new ResizeObserver(scheduleMobileFrameResize);
        observer.observe(app);
      }
    }

    const originalFilterSelection = window.filterSelection;
    if (typeof originalFilterSelection === "function") {
      window.filterSelection = function (category) {
        originalFilterSelection(category);
        scheduleMobileFrameResizeSeries();
      };
    }

    scheduleMobileFrameResizeSeries();
  }

  window.addEventListener("resize", applyMobileImageDisplayMode, { passive: true });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      initPublicationPage();
      enableMobileScrollHandoffOnly();
    });
  } else {
    initPublicationPage();
    enableMobileScrollHandoffOnly();
  }
})();
</script>
</main>

<script>
(() => {
  "use strict";

  const hero = document.getElementById("publicationHero");
  const canvas = document.getElementById("publicationParticleCanvas");
  if (!hero || !canvas) return;

  const context = canvas.getContext("2d");
  if (!context) return;

  const DESKTOP_PARTICLE_COUNT = 70;
  const MOBILE_PARTICLE_COUNT = 36;
  const CONNECTION_DISTANCE = 130;
  const POINTER_DISTANCE = 160;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const compactViewport = window.matchMedia("(max-width: 600px)");
  const pointer = { x: -1000, y: -1000, active: false };
  let particles = [];
  let width = 0;
  let height = 0;
  let animationFrame = 0;

  class Particle {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = (Math.random() - 0.5) * 0.8;
      this.radius = Math.random() * 2 + 1.5;
      this.alpha = Math.random() * 0.5 + 0.4;
    }

    update() {
      if (pointer.active) {
        const dx = pointer.x - this.x;
        const dy = pointer.y - this.y;
        const distance = Math.hypot(dx, dy);
        if (distance < POINTER_DISTANCE) {
          this.vx += dx * 0.0015;
          this.vy += dy * 0.0015;
        }
      }

      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.99;
      this.vy *= 0.99;
      if (this.x <= 0 || this.x >= width) this.vx *= -1;
      if (this.y <= 0 || this.y >= height) this.vy *= -1;
      this.x = Math.max(0, Math.min(width, this.x));
      this.y = Math.max(0, Math.min(height, this.y));
    }
  }

  function resizeCanvas() {
    const bounds = hero.getBoundingClientRect();
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.max(1, bounds.width);
    height = Math.max(1, bounds.height);
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    const particleCount = compactViewport.matches ? MOBILE_PARTICLE_COUNT : DESKTOP_PARTICLE_COUNT;
    particles = Array.from({ length: particleCount }, () => new Particle());
  }

  function drawFrame() {
    context.clearRect(0, 0, width, height);
    for (const particle of particles) {
      if (!reducedMotion.matches) particle.update();
    }

    for (let first = 0; first < particles.length; first += 1) {
      for (let second = first + 1; second < particles.length; second += 1) {
        const a = particles[first];
        const b = particles[second];
        const distance = Math.hypot(a.x - b.x, a.y - b.y);
        if (distance >= CONNECTION_DISTANCE) continue;
        context.beginPath();
        context.strokeStyle = `rgba(28, 71, 124, ${(1 - distance / CONNECTION_DISTANCE) * 0.5})`;
        context.lineWidth = 0.8;
        context.moveTo(a.x, a.y);
        context.lineTo(b.x, b.y);
        context.stroke();
      }
    }

    for (const particle of particles) {
      context.beginPath();
      context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
      context.fillStyle = `rgba(216, 167, 47, ${particle.alpha})`;
      context.fill();
    }

    if (!reducedMotion.matches) animationFrame = window.requestAnimationFrame(drawFrame);
  }

  function restart() {
    window.cancelAnimationFrame(animationFrame);
    resizeCanvas();
    drawFrame();
  }

  hero.addEventListener("pointermove", event => {
    const bounds = canvas.getBoundingClientRect();
    pointer.x = event.clientX - bounds.left;
    pointer.y = event.clientY - bounds.top;
    pointer.active = true;
  }, { passive: true });

  hero.addEventListener("pointerleave", () => {
    pointer.x = -1000;
    pointer.y = -1000;
    pointer.active = false;
  }, { passive: true });

  window.addEventListener("resize", restart, { passive: true });
  reducedMotion.addEventListener("change", restart);
  compactViewport.addEventListener("change", restart);
  restart();
})();
</script>
